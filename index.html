<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js"></script>
    <style>
      .button {
        display: block;
      }
    </style>

  <body>
    <h1>Bulb Project</h1>
    <div class="grid">
      <button type="button" class="button" onclick="turnon()">

        height="100px"
        class="img"
        id="bulb"
      />

        Turn off Light
      </button>
    </div>
  </body>
</html>
